name: kol-platform
services:
  kol-web:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATA_SOURCE_MODE: mock
      KOL_DEPLOYMENT_ENV: preview
      KOL_PRODUCTION_RUNTIME_READY: "false"
      ALCOHOL_MODULE_ENABLED: "false"
    ports:
      - "127.0.0.1:3100:3000"
    mem_limit: 896m
    cpus: 1.5
    pids_limit: 160
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 75s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
