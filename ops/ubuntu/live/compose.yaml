name: kol-live

x-service: &service
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  networks: [kol-private]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  db:
    <<: *service
    image: supabase/postgres:17.11.0.006
    mem_limit: 1024m
    cpus: 1.5
    pids_limit: 200
    shm_size: 128m
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
      JWT_EXP: "3600"
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, shared_buffers=128MB, -c, max_connections=60, -c, work_mem=4MB, -c, maintenance_work_mem=64MB]
    volumes:
      - kol-db:/var/lib/postgresql/data
      - kol-db-config:/etc/postgresql-custom
      - ${KOL_CONFIG_DIR:?required}/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ${KOL_CONFIG_DIR:?required}/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ${KOL_CONFIG_DIR:?required}/db/identity.sql:/docker-entrypoint-initdb.d/init-scripts/zz-kol-identity.sql:ro
    ports: ["127.0.0.1:54332:5432"]
    healthcheck:
      test: [CMD, pg_isready, -h, localhost, -U, postgres]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  auth:
    <<: *service
    image: supabase/gotrue:v2.197.0
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 100
    depends_on:
      db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${KOL_API_ORIGIN:?required}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${KOL_SITE_ORIGIN:?required}
      GOTRUE_URI_ALLOW_LIST: ${KOL_SITE_ORIGIN}/auth/callback
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?required}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_ISSUER: ${KOL_API_ORIGIN}/auth/v1
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:9999/health]
      interval: 10s
      timeout: 5s
      retries: 20

  rest:
    <<: *service
    image: supabase/postgrest:v16.5
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 100
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_POOL: "8"
      PGRST_JWT_SECRET: ${JWT_SECRET:?required}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 10s
      timeout: 5s
      retries: 20

  storage:
    <<: *service
    image: supabase/storage-api:v1.84.19
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 120
    depends_on:
      db: {condition: service_healthy}
      rest: {condition: service_started}
    environment:
      ANON_KEY: ${ANON_KEY:?required}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?required}
      AUTH_JWT_SECRET: ${JWT_SECRET:?required}
      POSTGREST_URL: http://rest:3000
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${KOL_API_ORIGIN}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: "8388608"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: kol-live
      TENANT_ID: kol-live
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?required}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_SECRET_KEY:?required}
      DB_POOL_MAX: "8"
    volumes: ["kol-storage:/var/lib/storage"]
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:5000/status]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  gateway:
    <<: *service
    image: nginx:1.30.6-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 40
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN]
    entrypoint: [nginx, -g, "daemon off;"]
    depends_on:
      auth: {condition: service_healthy}
      rest: {condition: service_healthy}
      storage: {condition: service_healthy}
    ports: ["127.0.0.1:54331:8080"]
    volumes: ["${KOL_CONFIG_DIR:?required}/gateway.conf:/etc/nginx/nginx.conf:ro"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  kol-private:
    name: kol-live-private
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
    labels: {ai-prof.project: kol-live}

volumes:
  kol-db:
    name: kol-live-db
    labels: {ai-prof.project: kol-live}
  kol-db-config:
    name: kol-live-db-config
    labels: {ai-prof.project: kol-live}
  kol-storage:
    name: kol-live-storage
    labels: {ai-prof.project: kol-live}
