name: KOL Production Encrypted Backup and Independent Restore

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kol-production-source-recovery
  cancel-in-progress: false

jobs:
  production-source-restore:
    if: >-
      github.repository == 'stvelikiy-star/kol-travel-platform' &&
      github.actor == 'stvelikiy-star' &&
      github.ref == 'refs/heads/release/kol-cloud-production-canary-20261123' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      KOL_PRODUCTION_DATABASE_URL: ${{ secrets.KOL_PRODUCTION_DATABASE_URL }}
      KOL_PRODUCTION_BACKUP_PASSPHRASE: ${{ secrets.KOL_PRODUCTION_BACKUP_PASSPHRASE }}
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate fail-closed source credentials, never print values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KOL_PRODUCTION_DATABASE_URL:-}" || { echo 'Missing dedicated Production PostgreSQL secret'; exit 1; }
          test -n "${KOL_PRODUCTION_BACKUP_PASSPHRASE:-}" || { echo 'Missing independent recovery passphrase'; exit 1; }
          bash -n scripts/run-production-backup-restore-ci.sh
          bash -n scripts/backup-live-supabase.sh
          bash -n scripts/rehearse-live-backup-restore.sh
      - name: Install pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          VERSION=3.2.0
          ARCHIVE="${RUNNER_TEMP}/supabase_cli.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 10 --max-time 120 \
            --output "$ARCHIVE" \
            "https://github.com/supabase/cli/releases/download/v${VERSION}/supabase_${VERSION}_linux_amd64.tar.gz"
          mkdir -p "${RUNNER_TEMP}/kol-supabase-cli"
          tar -xzf "$ARCHIVE" -C "${RUNNER_TEMP}/kol-supabase-cli"
          echo "${RUNNER_TEMP}/kol-supabase-cli" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/kol-supabase-cli/supabase" --version | grep -Fx "$VERSION"
      - name: Ensure database and encryption utilities
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          command -v openssl >/dev/null
      - name: Encrypted Production backup and independent disposable restore
        shell: bash
        run: bash scripts/run-production-backup-restore-ci.sh
      - name: Upload encrypted recovery package only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kol-production-encrypted-recovery-${{ github.run_id }}
          path: .kol-production-recovery-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
