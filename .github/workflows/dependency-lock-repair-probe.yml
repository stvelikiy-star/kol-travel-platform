name: KOL Dependency Lock Repair Probe

on:
  pull_request:
    paths:
      - ".github/workflows/dependency-lock-repair-probe.yml"

permissions:
  contents: write

jobs:
  lock-repair-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/admin-catalog-moderation-current-main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate and commit lock-only security repair
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only
          npm audit --audit-level=high
          git diff --exit-code -- package.json || { echo 'package.json changed unexpectedly' >&2; exit 1; }
          if git diff --quiet -- package-lock.json; then
            echo 'No package-lock repair required.'
            exit 0
          fi
          echo '--- PACKAGE LOCK DIFF START ---'
          git diff -- package-lock.json
          echo '--- PACKAGE LOCK DIFF END ---'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(deps): repair browserslist audit advisory'
          git push origin HEAD:feat/admin-catalog-moderation-current-main
