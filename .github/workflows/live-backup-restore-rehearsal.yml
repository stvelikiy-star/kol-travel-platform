name: KOL Live Backup Restore Rehearsal

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "restore or schema-only export"
        type: choice
        required: true
        default: restore
        options: [restore, schema_export]
  # 2026-11-21 post-index recovery verification: cloud baseline now 69 tables / 35 migrations.
  # Explicit recovery commits on the existing release branch may start the
  # real read-only-source rehearsal without needing a dashboard dispatch.
  push:
    branches: [release/kol-approved-ui-rc1-20261022, release/kol-unified-p0-20261120]
    paths:
      - ".github/workflows/live-backup-restore-rehearsal.yml"
      - "scripts/check-live-backup-tooling.mjs"
      - "scripts/run-live-backup-restore-rehearsal-ci.sh"
      - "scripts/backup-live-supabase.sh"
      - "scripts/rehearse-live-backup-restore.sh"
  pull_request:
    paths:
      - "scripts/check-live-backup-tooling.mjs"
      - "scripts/run-live-backup-restore-rehearsal-ci.sh"
      - "scripts/start-local-supabase-with-retry.sh"
      - "scripts/backup-live-supabase.sh"
      - "scripts/rehearse-live-backup-restore.sh"
      - "scripts/ubuntu-kol-backup-restore.sh"
      - ".github/workflows/live-backup-restore-rehearsal.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'kol-shared-cloud-qa-backup' || format('kol-live-backup-restore-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  tooling-check:
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'schema_export'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate backup tooling
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/backup-live-supabase.sh
          bash -n scripts/rehearse-live-backup-restore.sh
          bash -n scripts/run-live-backup-restore-rehearsal-ci.sh
          bash -n scripts/start-local-supabase-with-retry.sh
          bash -n scripts/ubuntu-kol-backup-restore.sh
          npm run check:live-backup-tooling

  live-backup-restore-rehearsal:
    if: >-
      github.repository == 'stvelikiy-star/kol-travel-platform' &&
      (github.event_name != 'workflow_dispatch' || inputs.operation != 'schema_export') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/release/kol-approved-ui-rc1-20261022' || github.ref == 'refs/heads/release/kol-unified-p0-20261120') &&
        contains(github.event.head_commit.message, '[kol-source-recovery]')))
    needs: tooling-check
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      KOL_DATABASE_URL: ${{ secrets.KOL_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require protected live DB secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KOL_DATABASE_URL:-}" ]; then
            echo "KOL_DATABASE_URL GitHub Actions secret is required." >&2
            exit 1
          fi
          case "$KOL_DATABASE_URL" in
            *mphruawzozrpwcjgejhs*) ;;
            *) echo "KOL_DATABASE_URL does not identify the expected KÖL project ref; refusing to run." >&2; exit 1 ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Setup Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_CLI_VERSION="3.2.0"
          SUPABASE_CLI_DIR="${RUNNER_TEMP}/supabase-cli"
          SUPABASE_CLI_ARCHIVE="${RUNNER_TEMP}/supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          SUPABASE_CLI_URL="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          rm -rf "$SUPABASE_CLI_DIR" "$SUPABASE_CLI_ARCHIVE"
          mkdir -p "$SUPABASE_CLI_DIR"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 --output "$SUPABASE_CLI_ARCHIVE" "$SUPABASE_CLI_URL"
          tar -xzf "$SUPABASE_CLI_ARCHIVE" -C "$SUPABASE_CLI_DIR"
          chmod +x "$SUPABASE_CLI_DIR/supabase"
          echo "$SUPABASE_CLI_DIR" >> "$GITHUB_PATH"
          ACTUAL_VERSION="$("$SUPABASE_CLI_DIR/supabase" --version | tr -d '\r\n')"
          if [ "$ACTUAL_VERSION" != "$SUPABASE_CLI_VERSION" ]; then
            echo "Unexpected Supabase CLI version: $ACTUAL_VERSION" >&2
            exit 1
          fi
          echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io" >> "$GITHUB_ENV"

      - name: Ensure PostgreSQL and crypto clients
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
          openssl version
          supabase --version

      - name: Run live backup, disposable restore and restored-live migration rehearsal
        shell: bash
        run: bash scripts/run-live-backup-restore-rehearsal-ci.sh

      - name: Upload encrypted recovery package and sanitized evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kol-live-recovery-${{ github.run_id }}
          path: .kol-ci-artifacts/
          # upload-artifact v4 excludes hidden directories unless explicitly enabled.
          # This path contains only encrypted backup files and sanitized evidence.
          include-hidden-files: true
          # Preserve a valid encrypted backup even if a later migration fails.
          # Absence of an archive must not hide the original failing step.
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

  production-schema-export:
    if: >-
      github.repository == 'stvelikiy-star/kol-travel-platform' &&
      github.ref == 'refs/heads/release/kol-unified-p0-20261120' &&
      github.actor == 'stvelikiy-star' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'schema_export'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KOL_DATABASE_URL: ${{ secrets.KOL_DATABASE_URL }}
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Restrict schema-only export to dedicated KOL TEST PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KOL_DATABASE_URL:-}"
          case "$KOL_DATABASE_URL" in
            *mphruawzozrpwcjgejhs*) ;;
            *) echo "Source is not the isolated KOL TEST project" >&2; exit 1 ;;
          esac
      - name: Install pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          VERSION=3.2.0
          curl --fail --silent --show-error --location --retry 2 \
            --output /tmp/supabase-cli.tar.gz \
            "https://github.com/supabase/cli/releases/download/v${VERSION}/supabase_${VERSION}_linux_amd64.tar.gz"
          mkdir -p /tmp/kol-supabase-cli
          tar -xzf /tmp/supabase-cli.tar.gz -C /tmp/kol-supabase-cli
          echo /tmp/kol-supabase-cli >> "$GITHUB_PATH"
      - name: Export canonical application schema (no rows, no Auth users)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-schema-export
          supabase db dump --db-url "$KOL_DATABASE_URL" \
            --file production-schema-export/kol-current-schema.sql
          test -s production-schema-export/kol-current-schema.sql
          printf '%s\n' 'source=kol-travel-platform-test' \
            'ref=mphruawzozrpwcjgejhs' \
            'mode=SCHEMA_ONLY_NO_COMMERCIAL_DATA' \
            'production_applied=false' \
            "sha256=$(sha256sum production-schema-export/kol-current-schema.sql | cut -d' ' -f1)" \
            > production-schema-export/MANIFEST.txt
          echo "KOL_SCHEMA_ONLY_EXPORT_COMPLETE"
      - name: Save private, short-lived schema export
        uses: actions/upload-artifact@v4
        with:
          name: kol-production-schema-only-${{ github.run_id }}
          path: production-schema-export/
          retention-days: 5
          if-no-files-found: error
