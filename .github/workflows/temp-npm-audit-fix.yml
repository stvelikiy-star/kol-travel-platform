name: Temporary NPM Audit Fix

on:
  push:
    branches:
      - feature/kol-ai-agent-v1
    paths:
      - ".github/workflows/temp-npm-audit-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/kol-ai-agent-v1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply non-breaking npm audit fixes
        run: npm audit fix
      - name: Commit generated dependency fixes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): apply npm audit dependency fixes"
          git push origin HEAD:feature/kol-ai-agent-v1
