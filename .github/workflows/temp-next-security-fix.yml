name: Temporary Next Security Upgrade

on:
  push:
    branches:
      - feature/kol-ai-agent-v1
    paths:
      - ".github/workflows/temp-next-security-fix.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/kol-ai-agent-v1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Upgrade patched Next.js and lockfile
        run: npm install next@16.3.8 --save-exact
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): upgrade Next.js to 16.3.8"
          git push origin HEAD:feature/kol-ai-agent-v1
