name: KOL CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kol-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair_lockfile:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/kol-tailwind4-security-20261021' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/kol-tailwind4-security-20261021
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(kol): align audit-compatible eslint lockfile"
          git push origin HEAD:fix/kol-tailwind4-security-20261021
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATA_SOURCE_MODE: mock
      KOL_DEPLOYMENT_ENV: development
      ALCOHOL_MODULE_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full dependency graph
        run: npm audit --audit-level=high

      - name: Verify recovered Supabase schema files
        run: npm run check:supabase-schema-files

      - name: Verify staging execution package
        run: npm run check:staging-package

      - name: Verify live baseline evidence is read-only
        run: npm run check:live-baseline-readonly

      - name: Verify live backup tooling is fail-closed
        run: npm run check:live-backup-tooling

      - name: Verify backup shell syntax
        run: bash -n scripts/backup-live-supabase.sh scripts/rehearse-live-backup-restore.sh

      - name: Verify deployment environment
        run: npm run check:deployment-env

      - name: Verify deployment fail-closed scenarios
        run: npm run check:deployment-env:selftest

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Production build in intentional mock mode
        run: npm run build

      - name: Export verified Vercel source
        uses: actions/upload-artifact@v7
        with:
          name: kol-vercel-source
          if-no-files-found: error
          retention-days: 1
          path: |
            package.json
            package-lock.json
            eslint.config.mjs
            next-env.d.ts
            next.config.*
            tsconfig.json
            postcss.config.js
            tailwind.config.*
            src/**
            public/**
