name: KOL CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'release/kol-unified-qa-candidate-20261125')) && 'kol-shared-cloud-qa-backup' || format('kol-ci-{0}-{1}', github.workflow, github.ref) }}
  # Never interrupt the trusted candidate Auth/Delivery QA before cleanup.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !(github.event_name == 'pull_request' && github.head_ref == 'release/kol-unified-qa-candidate-20261125') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATA_SOURCE_MODE: mock
      KOL_DEPLOYMENT_ENV: development
      ALCOHOL_MODULE_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full dependency graph
        run: npm audit --audit-level=high

      - name: Verify recovered Supabase schema files
        run: npm run check:supabase-schema-files

      - name: Verify approved winter image integrity
        run: KOL_REQUIRE_WINTER_MEDIA=1 npm run check:winter-media

      - name: Verify staging execution package
        run: npm run check:staging-package

      - name: Verify Ubuntu cutover contract
        run: npm run check:ubuntu-cutover-contract

      - name: Verify passwordless onboarding integration
        run: npm run check:client-onboarding

      - name: Verify live baseline evidence is read-only
        run: npm run check:live-baseline-readonly

      - name: Verify live backup tooling is fail-closed
        run: npm run check:live-backup-tooling

      - name: Verify backup shell syntax
        run: bash -n scripts/backup-live-supabase.sh scripts/rehearse-live-backup-restore.sh

      - name: Verify Ubuntu recovery safeguards without host changes
        run: python3 -m unittest discover -s scripts -p 'test_ubuntu_recovery_safety.py' -v

      - name: Verify local backup encryption and health safeguards
        run: |
          command -v gpg
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_kol_local_operations.py' -v

      - name: Verify deployment environment
        run: npm run check:deployment-env

      - name: Verify deployment fail-closed scenarios
        run: npm run check:deployment-env:selftest

      - name: Test release business rules with real behavior
        run: npm run check:release-behavior

      - name: Check one-shot cloud QA source syntax
        run: |
          node --check scripts/qa-cloud-auth-roles.mjs
          node --check scripts/qa-cloud-delivery-e2e.mjs

      - name: Verify booking concurrency test rejects live or missing configuration
        run: node scripts/qa-disposable-booking-safety-selftest.mjs

      - name: Test bounded RPC contracts
        run: npm run check:rpc-timeouts

      - name: Audit all exported server action authorization
        run: npm run check:action-auth

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Production build in intentional mock mode
        run: npm run build

      - name: Verify production mock fail-closed routes on local Next only
        run: npm run check:production-route-guard

      - name: Run complete release-source aggregate gate
        run: npm run check:release-source

      - name: Export verified Vercel source
        uses: actions/upload-artifact@v7
        with:
          name: kol-vercel-source
          if-no-files-found: error
          retention-days: 1
          path: |
            package.json
            package-lock.json
            eslint.config.mjs
            next-env.d.ts
            next.config.*
            tsconfig.json
            postcss.config.js
            tailwind.config.*
            src/**
            public/**

  cloud-auth-qa:
    # Cloud Auth checks may run only by owner dispatch OR on the explicitly
    # isolated in-repository release candidate PR. Forks never receive secrets.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/release/kol-unified-p0-20261120' ||
        github.ref == 'refs/heads/feat/kol-content-visual-editor-20261123' ||
        github.ref == 'refs/heads/feat/kol-superadmin-user-access-20261124' ||
        github.ref == 'refs/heads/release/kol-unified-qa-candidate-20261125') &&
       github.actor == 'stvelikiy-star') ||
      (github.event_name == 'pull_request' &&
       github.repository == 'stvelikiy-star/kol-travel-platform' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'release/kol-unified-qa-candidate-20261125' &&
       github.actor == 'stvelikiy-star')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      KOL_QA_SUPABASE_URL: https://mphruawzozrpwcjgejhs.supabase.co
      KOL_QA_SERVICE_ROLE_KEY: ${{ secrets.KOL_QA_SERVICE_ROLE_KEY }}
      KOL_QA_PUBLISHABLE_KEY: ${{ vars.KOL_QA_PUBLISHABLE_KEY }}
    steps:
      - name: Check dedicated QA credentials without displaying values
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KOL_QA_SERVICE_ROLE_KEY}" || -z "${KOL_QA_PUBLISHABLE_KEY}" ]]; then
            echo "::error::Configure KOL_QA_SERVICE_ROLE_KEY secret and KOL_QA_PUBLISHABLE_KEY variable in repository Actions settings. No Auth users were created."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Test exact PR HEAD, rather than a moving pull_request merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact locked dependencies
        id: deps
        run: npm ci --ignore-scripts
      - name: Static QA script validation
        run: node --check scripts/qa-cloud-auth-roles.mjs
      - name: Real signed-in QA on test Supabase
        run: node scripts/qa-cloud-auth-roles.mjs --run
      - name: Independent tagged-fixture cleanup after success or failure
        if: ${{ always() && steps.deps.outcome == 'success' }}
        run: node scripts/qa-cloud-auth-roles.mjs --cleanup
      - name: Confirm legacy Auth users listing works without SQL scan errors
        run: node scripts/qa-cloud-auth-admin-list.mjs
      - name: Send one real QA staff invitation, only if not already issued
        run: node scripts/qa-real-staff-invite-once.mjs

  cloud-delivery-e2e:
    # The delivery job follows successful Auth QA on the trusted same-repo
    # candidate, or the previous owner-only manual dispatch branches.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/release/kol-unified-p0-20261120' ||
        github.ref == 'refs/heads/feat/kol-content-visual-editor-20261123' ||
        github.ref == 'refs/heads/feat/kol-superadmin-user-access-20261124' ||
        github.ref == 'refs/heads/release/kol-unified-qa-candidate-20261125') &&
       github.actor == 'stvelikiy-star') ||
      (github.event_name == 'pull_request' &&
       github.repository == 'stvelikiy-star/kol-travel-platform' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'release/kol-unified-qa-candidate-20261125' &&
       github.actor == 'stvelikiy-star')
    needs: cloud-auth-qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      KOL_QA_SUPABASE_URL: https://mphruawzozrpwcjgejhs.supabase.co
      KOL_QA_SERVICE_ROLE_KEY: ${{ secrets.KOL_QA_SERVICE_ROLE_KEY }}
      KOL_QA_PUBLISHABLE_KEY: ${{ vars.KOL_QA_PUBLISHABLE_KEY }}
      KOL_DATABASE_URL: ${{ secrets.KOL_DATABASE_URL }}
    steps:
      - name: Verify test-only protected credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KOL_QA_SERVICE_ROLE_KEY}" || -z "${KOL_QA_PUBLISHABLE_KEY}" || -z "${KOL_DATABASE_URL}" ]]; then
            echo "::error::Test-only Auth and PostgreSQL secrets are required. No QA fixtures created."
            exit 1
          fi
          if [[ "${KOL_DATABASE_URL}" != *mphruawzozrpwcjgejhs* ]]; then
            echo "::error::PostgreSQL secret does not identify expected QA project; abort."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Test exact PR HEAD, rather than a moving pull_request merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        id: deps
        run: npm ci --ignore-scripts
      - name: Ensure QA PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          node --check scripts/qa-cloud-delivery-e2e.mjs
      - name: Real JWT cloud delivery acceptance and idempotency
        timeout-minutes: 12
        run: node scripts/qa-cloud-delivery-e2e.mjs --run
      - name: Independently remove scoped QA business and Auth fixtures
        if: ${{ always() && steps.deps.outcome == 'success' }}
        run: node scripts/qa-cloud-delivery-e2e.mjs --cleanup
      - name: Synthetic finance request and independent approval — ROLLBACK only
        timeout-minutes: 2
        run: psql -X -v ON_ERROR_STOP=1 -d "$KOL_DATABASE_URL" -f scripts/qa-cloud-finance-rollback.sql
      - name: Independently restore AES-256-GCM encrypted QA Storage bytes and remove owned test files
        timeout-minutes: 3
        run: node scripts/qa-storage-bytes-restore.mjs

  authorized-visual-qa:
    # Execute after real cloud Auth/Delivery E2E to prevent shared QA fixtures
    # from racing against snapshots or cleanup.
    needs: cloud-delivery-e2e
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'stvelikiy-star/kol-travel-platform' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'release/kol-unified-qa-candidate-20261125' &&
      github.event.pull_request.number == 182 &&
      github.actor == 'stvelikiy-star'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      DATA_SOURCE_MODE: supabase
      KOL_DEPLOYMENT_ENV: preview
      KOL_DEMO_ACCESS: "false"
      ALCOHOL_MODULE_ENABLED: "false"
      KOL_PRODUCTION_RUNTIME_READY: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_SUPABASE_URL: https://mphruawzozrpwcjgejhs.supabase.co
      KOL_QA_SUPABASE_URL: https://mphruawzozrpwcjgejhs.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.KOL_QA_PUBLISHABLE_KEY }}
      KOL_QA_PUBLISHABLE_KEY: ${{ vars.KOL_QA_PUBLISHABLE_KEY }}
      KOL_QA_SERVICE_ROLE_KEY: ${{ secrets.KOL_QA_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KOL_QA_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked app dependencies
        run: npm ci
      - name: Install isolated QA browser
        shell: bash
        run: |
          set -euo pipefail
          QA_BROWSER="${RUNNER_TEMP}/kol-auth-visual-browser"
          mkdir -p "$QA_BROWSER"
          npm install --prefix "$QA_BROWSER" --save-exact --ignore-scripts --no-fund playwright@1.62.1
          npx --prefix "$QA_BROWSER" playwright install --with-deps chromium
          echo "KOL_PLAYWRIGHT_MODULE=file://$QA_BROWSER/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Build TEST-only protected application
        run: npm run build
      - name: Start TEST-only application
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3100 > /tmp/kol-auth-design-app.log 2>&1 &
          echo $! >/tmp/kol-auth-design-app.pid
          for attempt in {1..70}; do
            if curl -fsS http://127.0.0.1:3100/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "QA local Next server did not start" >&2
          exit 1
      - name: Capture six signed-in roles, RU/KG/EN and QA editor; clean tagged fixtures
        run: node scripts/qa-cloud-design-screenshots.mjs
      - name: Upload authenticated design screenshots and sanitized JSON evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kol-auth-design-evidence-${{ github.run_id }}
          path: design-evidence/**
          retention-days: 7
          if-no-files-found: warn
      - name: Show local app errors only on failure
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/kol-auth-design-app.log ]; then
            grep -E "Error:|FATAL|compile|500" /tmp/kol-auth-design-app.log | tail -n 20 || true
          fi
