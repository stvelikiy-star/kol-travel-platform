name: KOL CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kol-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair_dependencies:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/kol-production-dependencies-20261021' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kol-production-dependencies-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Repair lockfile and run audits
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --save-exact next@16.4.2 eslint-config-next@16.4.2
          npm audit fix --package-lock-only --ignore-scripts
          git diff --check
      - name: Write repaired manifests to isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(kol): refresh vulnerable dependency lockfile"
          git push origin HEAD:fix/kol-production-dependencies-20261021
      - name: Audit production dependency tree after saving repair
        run: npm audit --omit=dev --audit-level=high
      - name: Audit full dependency tree after saving production repair
        run: npm audit --audit-level=high
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATA_SOURCE_MODE: mock
      KOL_DEPLOYMENT_ENV: development
      ALCOHOL_MODULE_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full dependency graph
        run: npm audit --audit-level=high

      - name: Verify recovered Supabase schema files
        run: npm run check:supabase-schema-files

      - name: Verify staging execution package
        run: npm run check:staging-package

      - name: Verify live baseline evidence is read-only
        run: npm run check:live-baseline-readonly

      - name: Verify live backup tooling is fail-closed
        run: npm run check:live-backup-tooling

      - name: Verify backup shell syntax
        run: bash -n scripts/backup-live-supabase.sh scripts/rehearse-live-backup-restore.sh

      - name: Verify deployment environment
        run: npm run check:deployment-env

      - name: Verify deployment fail-closed scenarios
        run: npm run check:deployment-env:selftest

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Production build in intentional mock mode
        run: npm run build

      - name: Export verified Vercel source
        uses: actions/upload-artifact@v7
        with:
          name: kol-vercel-source
          if-no-files-found: error
          retention-days: 1
          path: |
            package.json
            package-lock.json
            eslint.config.mjs
            next-env.d.ts
            next.config.*
            tsconfig.json
            postcss.config.js
            tailwind.config.*
            src/**
            public/**
