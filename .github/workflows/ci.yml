name: KOL CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kol-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATA_SOURCE_MODE: mock
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve upgraded dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload resolved package lock
        uses: actions/upload-artifact@v4
        with:
          name: kol-next16-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Install resolved dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify recovered Supabase schema files
        run: npm run check:supabase-schema-files

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Production build in intentional mock mode
        run: npm run build
