name: KOL Security Relock Once

on:
  push:
    branches:
      - feat/client-profile-runtime
    paths:
      - .github/workflows/security-relock-once.yml

permissions:
  contents: write

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/client-profile-runtime

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Patch Next.js security release
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.3.5 eslint-config-next@16.3.5

      - name: Patch transitive sharp security release
        run: npm update --package-lock-only --ignore-scripts sharp

      - name: Patch transitive js-yaml security release
        run: npm update --package-lock-only --ignore-scripts js-yaml

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Verify full dependency audit
        run: npm audit --audit-level=high

      - name: Commit regenerated dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files already current."
            exit 0
          fi
          git commit -m "fix(security): patch dependency advisories"
          git push origin HEAD:feat/client-profile-runtime
