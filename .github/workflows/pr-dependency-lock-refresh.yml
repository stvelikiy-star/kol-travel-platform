name: PR Dependency Lock Refresh

on:
  pull_request:
    branches: [main]
    paths:
      - "package-lock.json"
      - ".github/workflows/pr-dependency-lock-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Refresh vulnerable dev dependency lock entries
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --audit-level=high
          npm audit --audit-level=high
          git diff --exit-code -- package.json
      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh audited dev dependency lock"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
