name: KOL Local Supabase Staging Smoke

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/run-local-supabase-staging-smoke.sh"
      - "scripts/run-local-supabase-public-runtime-smoke.sh"
      - "scripts/qa-local-supabase-auth-runtime.mjs"
      - "scripts/provision-catalog-media-bucket.mjs"
      - "src/lib/data/data-source.ts"
      - "src/lib/data/public-*-read.ts"
      - "src/lib/data/public-*-supabase.ts"
      - "src/lib/data/booking-write-supabase.ts"
      - "src/lib/auth/**"
      - "src/lib/supabase/**"
      - "src/app/actions/auth.ts"
      - "src/app/actions/client/clientBookingsReal.ts"
      - "src/components/booking/**"
      - "src/app/login/**"
      - "src/app/client/**"
      - "src/app/partner/**"
      - "src/app/courier/**"
      - "src/app/admin/**"
      - "src/app/stays/**"
      - "src/app/tours/**"
      - "src/app/food/**"
      - "src/app/shop/**"
      - ".github/workflows/local-supabase-smoke.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kol-local-supabase-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Install isolated browser Auth QA dependency
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_QA_DIR="${RUNNER_TEMP}/kol-playwright-qa"
          rm -rf "${PLAYWRIGHT_QA_DIR}"
          mkdir -p "${PLAYWRIGHT_QA_DIR}"
          (
            cd "${PLAYWRIGHT_QA_DIR}"
            npm init --yes >/dev/null
            npm install --save-exact --ignore-scripts playwright@1.62.1
            node -e "const version = require('playwright/package.json').version; if (version !== '1.62.1') { throw new Error('Unexpected Playwright version: ' + version); }"
            npm audit --audit-level=high
            npx playwright install --with-deps chromium
          )
          echo "KOL_PLAYWRIGHT_MODULE=file://${PLAYWRIGHT_QA_DIR}/node_modules/playwright/index.mjs" >> "${GITHUB_ENV}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
          supabase --version

      - name: Run isolated local Supabase staging smoke
        shell: bash
        run: bash scripts/run-local-supabase-staging-smoke.sh
