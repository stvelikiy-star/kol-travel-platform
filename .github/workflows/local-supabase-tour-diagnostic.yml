name: KOL Temporary Tour Booking Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/local-supabase-tour-diagnostic.yml"
      - "scripts/qa-local-supabase-auth-runtime.mjs"
      - "scripts/run-local-supabase-staging-smoke.sh"
      - "scripts/run-local-supabase-public-runtime-smoke.sh"
      - "src/components/booking/RealTourBookingPanel.tsx"
      - "src/app/actions/client/clientBookingsReal.ts"
      - "src/lib/data/booking-write-supabase.ts"
      - "src/app/tours/**"
      - "supabase/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kol-tour-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-tour-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Install isolated browser Auth QA dependency
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_QA_DIR="${RUNNER_TEMP}/kol-playwright-qa"
          rm -rf "${PLAYWRIGHT_QA_DIR}"
          mkdir -p "${PLAYWRIGHT_QA_DIR}"
          (
            cd "${PLAYWRIGHT_QA_DIR}"
            npm init --yes >/dev/null
            npm install --save-exact --ignore-scripts playwright@1.62.1
            node -e "const version = require('playwright/package.json').version; if (version !== '1.62.1') { throw new Error('Unexpected Playwright version: ' + version); }"
            npm audit --audit-level=high
            npx playwright install --with-deps chromium
          )
          echo "KOL_PLAYWRIGHT_MODULE=file://${PLAYWRIGHT_QA_DIR}/node_modules/playwright/index.mjs" >> "${GITHUB_ENV}"

      - name: Setup Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_CLI_VERSION="2.111.0"
          SUPABASE_CLI_DIR="${RUNNER_TEMP}/supabase-cli"
          SUPABASE_CLI_ARCHIVE="${RUNNER_TEMP}/supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          SUPABASE_CLI_URL="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          rm -rf "${SUPABASE_CLI_DIR}" "${SUPABASE_CLI_ARCHIVE}"
          mkdir -p "${SUPABASE_CLI_DIR}"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 120 \
            --output "${SUPABASE_CLI_ARCHIVE}" \
            "${SUPABASE_CLI_URL}"
          tar -xzf "${SUPABASE_CLI_ARCHIVE}" -C "${SUPABASE_CLI_DIR}"
          chmod +x "${SUPABASE_CLI_DIR}/supabase"
          echo "${SUPABASE_CLI_DIR}" >> "${GITHUB_PATH}"
          ACTUAL_VERSION="$("${SUPABASE_CLI_DIR}/supabase" --version | tr -d '\r\n')"
          test "${ACTUAL_VERSION}" = "${SUPABASE_CLI_VERSION}"
          echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io" >> "${GITHUB_ENV}"

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
          supabase --version

      - name: Instrument Tour failure path in runner only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/qa-local-supabase-auth-runtime.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const target = `  const tourStatus = page.getByRole("status").filter({
            hasText: "Бронь тура создана. Цена и количество мест подтверждены системой."
          });
          await tourStatus.waitFor({ timeout: 15000 });
          tourBookingId = extractBookingId(await tourStatus.innerText(), "Tour browser booking");`;
          const replacement = `  const tourStatus = page.getByRole("status").filter({
            hasText: "Бронь тура создана. Цена и количество мест подтверждены системой."
          });
          try {
            await tourStatus.waitFor({ timeout: 15000 });
          } catch (error) {
            const tourForm = page.locator('form[data-booking-ready]').last();
            const readiness = await tourForm.getAttribute('data-booking-ready').catch(() => null);
            const selectedSchedule = await tourForm.locator('select').inputValue().catch(() => null);
            const participantsValue = await page.getByLabel("Участников", { exact: true }).inputValue().catch(() => null);
            const statusTexts = await page.getByRole("status").allInnerTexts().catch(() => []);
            const buttonTexts = await tourForm.locator('button[type="submit"]').allInnerTexts().catch(() => []);
            const buttonDisabled = await tourForm.locator('button[type="submit"]').isDisabled().catch(() => null);
            const bookedCountAfter = Number(queryDbScalar(
              \`select booked_count from public.tour_schedules where id = \${sqlLiteral(TOUR_SCHEDULE_ID)}::uuid\`,
              "tour diagnostic booked count"
            ));
            const createdTourRows = queryDbRows(
              \`select id::text, status, guests_count, total::text, payment_status, metadata ->> 'tour_schedule_id' as tour_schedule_id from public.bookings where client_id = \${sqlLiteral(clientId)}::uuid and booking_type = 'tour' order by created_at desc limit 3\`,
              "tour diagnostic booking rows"
            );
            console.error("KOL_TOUR_BOOKING_BROWSER_DIAGNOSTICS", JSON.stringify({
              readiness,
              selectedSchedule,
              participantsValue,
              statusTexts,
              buttonTexts,
              buttonDisabled,
              bookedCountAfter,
              createdTourRows
            }));
            throw error;
          }
          tourBookingId = extractBookingId(await tourStatus.innerText(), "Tour browser booking");`;
          if (!text.includes(target)) {
            throw new Error('Tour diagnostic patch target not found; refusing broad mutation.');
          }
          text = text.replace(target, replacement);
          fs.writeFileSync(path, text);
          console.log('Temporary Tour diagnostic instrumentation installed in runner copy only.');
          NODE

      - name: Run isolated local Supabase staging smoke with Tour diagnostics
        shell: bash
        run: bash scripts/run-local-supabase-staging-smoke.sh
