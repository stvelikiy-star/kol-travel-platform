name: KOL one-time dependency repair
on:
  push:
    branches:
      - fix/kol-production-dependencies-20261021
    paths:
      - .github/workflows/kol-one-time-dependency-repair.yml
concurrency:
  group: kol-one-time-dependency-repair
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Repair manifest and lockfile without running install scripts
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --save-exact next@16.4.2 eslint-config-next@16.4.2
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          git diff --check
      - name: Commit only dependency files to this repair branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(kol): update vulnerable dependencies and lockfile"
          git push origin HEAD:fix/kol-production-dependencies-20261021
